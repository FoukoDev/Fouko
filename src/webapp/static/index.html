<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoukoBot AI</title>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="not-telegram" class="cover hidden">
  <p id="nt-text">Open this app from Telegram.</p>
</div>

<main id="app" class="hidden">

  <!-- Chat -->
  <section id="tab-chat" class="tab">
    <header id="chat-head" class="chat-head">
      <div id="chat-title" class="chat-title"></div>
      <div id="chat-sub" class="chat-sub"></div>
    </header>
    <div id="chat-log" class="chat-log"></div>
    <form id="chat-form" class="chat-input">
      <textarea id="chat-text" rows="1" autocomplete="off"></textarea>
      <button type="submit" id="chat-send" disabled>
        <svg id="send-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg id="stop-icon" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </form>
  </section>

  <!-- Chats -->
  <section id="tab-chats" class="tab hidden">
    <h2 id="chats-heading" class="sec"></h2>
    <div id="chats-list" class="list"></div>
    <h2 id="chats-new-heading" class="sec"></h2>
    <form id="chat-new-form" class="card form">
      <div id="new-chat-hint" class="hint hidden"></div>
      <input id="new-chat-name" autocomplete="off">
      <select id="new-chat-host"></select>
      <input id="new-chat-model" list="new-chat-models" autocomplete="off">
      <datalist id="new-chat-models"></datalist>
      <button type="submit" id="new-chat-btn" class="btn primary"></button>
    </form>
  </section>

  <!-- Hosts -->
  <section id="tab-hosts" class="tab hidden">
    <h2 id="hosts-heading" class="sec"></h2>
    <div id="hosts-list" class="list"></div>
    <h2 id="hosts-new-heading" class="sec"></h2>
    <form id="host-new-form" class="card form">
      <input id="new-host-name" autocomplete="off">
      <input id="new-host-url" autocomplete="off" inputmode="url">
      <input id="new-host-key" type="password" autocomplete="off">
      <button type="submit" id="new-host-btn" class="btn primary"></button>
    </form>
  </section>

  <!-- Settings -->
  <section id="tab-settings" class="tab hidden">
    <h2 id="sec-generation" class="sec"></h2>
    <div class="card group">
      <div class="setting">
        <label id="gen-image-label" for="gen-image"></label>
        <select id="gen-image"></select>
        <div id="gen-image-hint" class="hint"></div>
      </div>
      <div class="setting">
        <label id="gen-video-label" for="gen-video"></label>
        <select id="gen-video"></select>
        <div id="gen-video-hint" class="hint"></div>
      </div>
      <div class="setting">
        <label id="gen-audio-label" for="gen-audio"></label>
        <select id="gen-audio"></select>
        <div id="gen-audio-hint" class="hint"></div>
      </div>
    </div>

    <h2 id="sec-assistant" class="sec"></h2>
    <div class="card group">
      <div class="setting row-setting">
        <div class="grow">
          <label id="tools-label" for="tools-toggle"></label>
          <div id="tools-hint" class="hint"></div>
        </div>
        <label class="switch">
          <input type="checkbox" id="tools-toggle">
          <span></span>
        </label>
      </div>
      <div class="setting">
        <label id="voice-label" for="voice-select"></label>
        <select id="voice-select"></select>
        <div id="voice-hint" class="hint"></div>
      </div>
    </div>

    <h2 id="sec-appearance" class="sec"></h2>
    <div class="card group">
      <div class="setting">
        <label id="theme-label" for="theme-select"></label>
        <select id="theme-select"></select>
      </div>
      <div class="setting">
        <label id="lang-label" for="lang-select"></label>
        <select id="lang-select"></select>
      </div>
    </div>

    <h2 id="sec-info" class="sec"></h2>
    <div class="card group">
      <div class="info-row"><span id="info-version-label"></span><span id="info-version" class="dim"></span></div>
      <div class="info-row"><span id="info-chats-label"></span><span id="info-chats" class="dim"></span></div>
      <div class="info-row"><span id="info-hosts-label"></span><span id="info-hosts" class="dim"></span></div>
    </div>
  </section>

  <nav class="tabs">
    <button data-tab="chat" id="nav-chat" class="active" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5z"/></svg>
      <span class="label"></span>
    </button>
    <button data-tab="chats" id="nav-chats" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span class="label"></span>
    </button>
    <button data-tab="hosts" id="nav-hosts" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6.5h.01M6 17.5h.01"/></svg>
      <span class="label"></span>
    </button>
    <button data-tab="settings" id="nav-settings" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="label"></span>
    </button>
  </nav>

</main>

<!-- chat action sheet -->
<div id="sheet-backdrop" class="backdrop hidden"></div>
<div id="sheet" class="sheet hidden"></div>

<!-- modal (prompt editor, history viewer) -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn ghost" type="button"></button>
      <button id="modal-save" class="btn primary" type="button"></button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
