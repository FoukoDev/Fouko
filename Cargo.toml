[package]
name = "foukobot"
version = "0.1.2-alpha.1"
edition = "2021"
rust-version = "1.75"
authors = ["Fouko <mail@fouko.xyz>"]
description = "Reference cross-platform bot built on FoukoApi. Runs the same codebase on Telegram and Discord with shared profile, XP, coins and linked accounts."
license = "MIT"
repository = "https://github.com/FoukoDev/Fouko"
homepage = "https://bot.fouko.xyz"
readme = "README.md"
keywords = ["bot", "telegram", "discord", "chat", "foukoapi"]
categories = ["command-line-utilities"]
# FoukoBot is the reference application, not a library - users should
# deploy their own fork or use it as a template rather than depend on it.
publish = false

[dependencies]
# FoukoApi is pulled straight from crates.io. If you want to hack on both
# crates side-by-side, swap this line for a path dependency:
#     foukoapi = { path = "../FoukoApi", features = ["telegram", "discord", "sqlite", "crypto", "genai", "webapp", "tunnel"] }
foukoapi = { version = "0.1.2-alpha.1", features = ["telegram", "discord", "sqlite", "crypto", "genai", "webapp", "tunnel"] }

tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
tracing = "0.1"
# "chrono" only enables the short-time terminal format; chrono itself is
# already a direct dependency, so this pulls nothing new.
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"
anyhow = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# rzhunemogu.ru answers in Windows-1251; this decodes it (already in the
# tree via reqwest, so it costs nothing extra).
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# grapheme-aware /reverse; tiny, no transitive deps
unicode-segmentation = "1"
# The Mini App backend. Body limits and SSE ship in axum itself, so no
# tower-http needed.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Images travel to the web app as data URLs (already in the tree via
# foukoapi's genai feature).
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
